<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>宁宁的考公工作台</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📚</text></svg>">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-logo">📚</div>
      <div class="brand-text">
        <div class="brand-name">宁宁的考公工作台</div>
        <div class="brand-sub">坚持就是胜利 ✨</div>
      </div>
    </div>
    <nav class="nav">
      <a class="nav-item" href="#/dashboard" data-route="dashboard"><span class="nav-ic">📊</span>工作台</a>
      <a class="nav-item" href="#/daily" data-route="daily"><span class="nav-ic">📅</span>每日记录</a>
      <div class="nav-group-label">模块学习</div>
      <a class="nav-item" href="#/modules" data-route="modules"><span class="nav-ic">📚</span>全部模块</a>
      <div id="moduleNav"></div>
      <a class="nav-item" href="#/mistakes" data-route="mistakes"><span class="nav-ic">📝</span>错题本</a>
      <a class="nav-item" href="#/stats" data-route="stats"><span class="nav-ic">📈</span>统计</a>
      <a class="nav-item" href="#/settings" data-route="settings"><span class="nav-ic">⚙️</span>设置</a>
    </nav>
    <div class="goal-widget" id="goalWidget"></div>
  </aside>
  <main class="main">
    <header class="topbar">
      <div class="page-title" id="pageTitle"></div>
      <div class="topbar-right">
        <span class="today-chip" id="todayChip"></span>
        <button class="btn btn-primary" id="timerBtn">⏱️ 开始计时</button>
      </div>
    </header>
    <div class="content" id="app"></div>
  </main>
</div>

<div class="timer-pop" id="timerPop" hidden></div>
<div class="modal-backdrop" id="modalBackdrop" hidden></div>
<div class="toast-wrap" id="toastWrap"></div>

<script src="js/store.js"></script>
<script src="js/charts.js"></script>
<script src="js/app.js"></script>
</body>
</html>
